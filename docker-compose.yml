version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrations:
        condition: service completed sucessfully
    env_file:
      - .env
    ports:
      - "8000:8000"

  migrations:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    command: poetry run alembic upgrade head
    depends_on:
      - db

  db:
    image: postgres:17.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - data:/var/lib/postgresql/data
  
  mkdocs:
    image:
      context: .
      dockerfile: dockerfile.mkdocs
    ports:
      - "8001:80"

volumes:
  data: