version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-wishlist
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - portfolio-net

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: poetry run alembic upgrade head
    depends_on:
      db:
        condition: service_started
    networks:
      - portfolio-net

  db:
    image: postgres:17.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - portfolio-net

volumes:
  data:

networks:
  portfolio-net:
    name: portfolio-net
    external: true
